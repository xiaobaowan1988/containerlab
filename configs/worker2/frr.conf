frr version 9.1
frr defaults datacenter
hostname worker2
log syslog informational
!
interface lo
 ip address 10.255.0.5/32
 ip address 10.244.2.0/24
!
interface eth1
 ip address 10.0.1.3/31
 description to-tor2
!
router bgp 65101
 bgp router-id 10.255.0.5
 !
 neighbor 10.0.1.2 remote-as 65002
 neighbor 10.0.1.2 description tor2
 !
 address-family ipv4 unicast
  network 10.255.0.5/32
  network 10.244.2.0/24
  neighbor 10.0.1.2 activate
 exit-address-family
!
line vty
!
